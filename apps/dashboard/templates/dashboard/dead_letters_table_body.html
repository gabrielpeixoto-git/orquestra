{% for dl in dead_letters %}
<tr class="table-row">
    <td class="px-6 py-4 whitespace-nowrap text-sm font-mono text-gray-900 dark:text-gray-100">
        {{ dl.id|slice:":8" }}...
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 dark:text-gray-100">
        {{ dl.queue_name }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 dark:text-gray-100">
        {{ dl.message_type }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-red-600 dark:text-red-400 truncate max-w-xs">
        {{ dl.error_message }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
        {{ dl.created_at|date:"Y-m-d H:i" }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm space-x-2">
        <button onclick="replayDeadLetter('{{ dl.id }}')"
                class="px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700">
            Replay
        </button>
        <button onclick="discardDeadLetter('{{ dl.id }}')"
                class="px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700">
            Descartar
        </button>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="6" class="px-6 py-4 text-center text-gray-500 dark:text-gray-400">
        Nenhuma dead letter pendente
    </td>
</tr>
{% endfor %}
