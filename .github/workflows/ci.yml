name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: orquestra
          POSTGRES_USER: orquestra
          POSTGRES_PASSWORD: orquestra
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v8

      - name: Install dependencies
        run: uv sync --locked

      - name: Run check
        run: uv run poe check
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: orquestra
          DB_USER: orquestra
          DB_PASSWORD: orquestra
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672

      - name: Run tests
        run: uv run pytest --cov=apps --cov-report=xml
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: orquestra
          DB_USER: orquestra
          DB_PASSWORD: orquestra
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

      - name: Run pip-audit
        run: uv pip-audit

      - name: Build Docker image
        run: docker build -t orquestra:test .

      - name: Check OpenAPI drift
        run: |
          uv run python manage.py spectacular --color --file schema.yml
          if [ -f schema.yml ]; then
            git diff --exit-code schema.yml || echo "OpenAPI schema changed, commit the new schema.yml"
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
