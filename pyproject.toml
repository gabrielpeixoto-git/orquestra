[project]
name = "orquestra"
version = "0.1.0"
description = "Plataforma de processamento de pedidos orientada a eventos com saga orquestrada"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.18,<3.19",
    "drf-spectacular>=0.28,<0.29",
    "djangorestframework-simplejwt>=5.4,<5.5",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.12,<2.13",
    "pydantic-settings>=2.6,<2.7",
    "python-dotenv>=1.0,<1.1",
    "gunicorn>=23.0,<23.1",
    "whitenoise>=6.9,<6.10",
    "celery>=5.6,<5.7",
    "redis>=5.2,<5.3",
    "pika>=1.3,<1.4",
    "structlog~=25.1",
    "opentelemetry-api~=1.27",
    "opentelemetry-sdk~=1.27",
    "opentelemetry-instrumentation-django~=0.47b0",
    "opentelemetry-instrumentation-celery~=0.47b0",
    "opentelemetry-instrumentation-psycopg~=0.47b0",
    "opentelemetry-instrumentation-redis~=0.47b0",
    "opentelemetry-exporter-otlp~=1.27",
    "django-prometheus>=2.3,<2.4",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9,<0.10",
    "mypy>=1.14,<1.15",
    "django-stubs>=5.1,<5.2",
    "djangorestframework-stubs>=3.15,<3.16",
    "pytest>=8.3,<8.4",
    "pytest-django>=4.10,<4.11",
    "pytest-cov>=6.0,<6.1",
    "factory-boy>=3.3,<3.4",
    "poethepoet>=0.31,<0.32",
    "import-linter~=1.12",
    "pre-commit>=4.1,<4.2",
    "pip-audit>=2.8,<2.9",
]

[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.9,<0.10",
    "mypy>=1.14,<1.15",
    "django-stubs>=5.1,<5.2",
    "djangorestframework-stubs>=3.15,<3.16",
    "pytest>=8.3,<8.4",
    "pytest-django>=4.10,<4.11",
    "pytest-cov>=6.0,<6.1",
    "factory-boy>=3.3,<3.4",
    "poethepoet>=0.31,<0.32",
    "import-linter~=1.12",
    "pre-commit>=4.1,<4.2",
    "pip-audit>=2.8,<2.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T10", "EM", "ISC", "ICN", "G", "PIE", "T20", "PT", "Q", "RSE", "RET", "SIM", "TID", "TCH", "ARG", "PTH", "PL", "TRY", "FLY", "PERF", "RUF"]
ignore = [
    "PLR0913",
    "PLR0912",
    "PLR0915",
    "TRY003",
    "TRY300",  # else block after return (aceitável em services)
    "RUF012",  # ClassVar annotations em admin e migrations (aceitável para Django)
    "E402",    # Module level import não no topo (aceitável em settings e scripts)
    "TRY400",  # logger.error vs logger.exception (aceitável em services Django)
    "EM102",   # f-string em exceptions (aceitável em services Django)
    "DTZ005",  # datetime.now() sem timezone (aceitável em migrations)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201", "PTH100", "PTH120", "E501"]  # print, os.path e linhas longas em scripts
"apps/*/migrations/*" = ["RUF012"]  # Django migrations
"apps/*/admin.py" = ["RUF012"]  # Django admin
"apps/core/management/commands/*" = ["ARG002", "T201", "E501"]  # Django management commands
"apps/outbox/management/commands/*" = ["ARG002"]  # Django management commands
"tests/*" = ["PLR2004", "B007"]  # Magic values e loop variables em testes
"apps/*" = ["PLR2004"]  # Magic values em testes

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["manage.py", "apps/*/migrations/", "venv/", ".venv/", "apps/", "scripts/"]

[[tool.mypy.overrides]]
module = "config.settings.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pika.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "config.settings.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "apps"]
addopts = "--cov=apps --cov-report=term-missing --cov-report=html -m 'not integration'"
markers = [
    "integration: Tests that require external services (RabbitMQ, etc.)"
]

[tool.poe.tasks]
ruff-format = { cmd = "ruff format --check ." }
ruff-check = { cmd = "ruff check ." }
mypy-check = { cmd = "mypy ." }
django-check = { cmd = "python manage.py check" }
check = { sequence = ["ruff-format", "ruff-check", "mypy-check", "django-check"] }
smoke = { cmd = "python manage.py smoke --scenario success" }
replay-dlq = { cmd = "python manage.py replay_dlq" }
up = { cmd = "docker compose --profile lite up -d" }
up-obs = { cmd = "docker compose --profile lite --profile obs up -d" }
down = { cmd = "docker compose down" }
demo = { cmd = "python scripts/demo.py" }
k8s-kind-create = { cmd = "kind create cluster --config deploy/k8s/kind-config.yaml" }
k8s-kind-delete = { cmd = "kind delete cluster --name orquestra" }
k8s-apply = { cmd = "kubectl apply -k deploy/k8s/overlays/local" }
k8s-delete = { cmd = "kubectl delete -k deploy/k8s/overlays/local" }

[tool.importlinter]
root_modules = ["config", "apps"]

[[tool.importlinter.groups]]
name = "domain-isolation"
modules = ["apps.orders", "apps.inventory", "apps.payments", "apps.notifications", "apps.audit", "apps.orchestrator"]
forbidden_modules = ["apps.orders.services", "apps.inventory.services", "apps.payments.services"]
contain = true
