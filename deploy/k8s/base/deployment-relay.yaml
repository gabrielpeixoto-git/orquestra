apiVersion: apps/v1
kind: Deployment
metadata:
  name: orquestra-relay
  labels:
    app: orquestra
    component: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orquestra
      component: relay
  template:
    metadata:
      labels:
        app: orquestra
        component: relay
    spec:
      containers:
        - name: relay
          image: orquestra:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "relay"]
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings.production
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: orquestra-config
                  key: db-host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: orquestra-config
                  key: db-port
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: orquestra-config
                  key: db-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: orquestra-secret
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orquestra-secret
                  key: db-password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: orquestra-config
                  key: redis-host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: orquestra-config
                  key: redis-port
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: orquestra-config
                  key: rabbitmq-host
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: orquestra-config
                  key: rabbitmq-port
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: orquestra-secret
                  key: secret-key
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
